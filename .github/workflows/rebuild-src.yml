name: Rebuild autogenerated files
# لا جدولة، ولا دفع تلقائي إلى main. التغييرات تمر عبر PR.
on:
  push:
    paths:
      - accounts/*
      - collections/*
      - jettons/*
      - generator.py
      - dexes.py
      - readme.md.template
      - requirements.txt
      - .github/workflows/rebuild-src.yml
    branches-ignore:
      - main
  pull_request:
    paths:
      - accounts/*
      - collections/*
      - jettons/*
      - generator.py
      - dexes.py
  workflow_dispatch:

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TON_ASSETS_OFFLINE: ''   # اضبطه '1' إذا أردت بناءً بلا شبكة
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # pydantic==1.9.2 في requirements لا يدعم 3.12+
          cache: pip
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Run generator.py
        run: python3 generator.py
      - name: Push regenerated files to this branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m 'Regenerate json and Readme'
            git push
          fi
      - name: Fail if generated files are stale (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "الملفات المولّدة قديمة. شغّل: python3 generator.py"
            git diff --stat
            exit 1
          fi
